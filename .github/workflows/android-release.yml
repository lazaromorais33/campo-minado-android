name: Compilar APK e publicar no GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências Node
        run: npm install

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones Android
        run: python scripts/generate-icons.py

      - name: Sincronizar aplicativo HTML
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Disponibilizar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Campo-Minado-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Campo Minado ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
